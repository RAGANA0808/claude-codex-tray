name: Release

# Tag vX.Y.Z → run tests → build the exe from that exact tag on a clean
# GitHub-hosted runner → attach exe + SHA256SUMS to a GitHub Release.
# Binaries are never committed to the repository; this workflow is the only
# distribution path, so every published exe is reproducible from public source.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet pyinstaller pystray Pillow pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests (release gate)
        run: python -m pytest tests/ -v

      - name: Generate icons
        run: python make_icon.py

      - name: Build exe
        run: pyinstaller ClaudeCodexUsage.spec --noconfirm --clean

      - name: Compute checksum
        run: |
          $hash = (Get-FileHash dist/ClaudeCodexUsage.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ClaudeCodexUsage.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeCodexUsage.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            単一ファイルの Windows 用 exe です。Python のインストールは不要です。

            **検証**: ダウンロード後、PowerShell で
            `Get-FileHash ClaudeCodexUsage.exe -Algorithm SHA256`
            を実行し、SHA256SUMS.txt の値と一致することを確認してください。

            **SmartScreen**: コード署名をしていないため、初回起動時に Windows SmartScreen の警告が出ます。「詳細情報」→「実行」で起動できます。ソースからのビルド手順は README を参照してください。
