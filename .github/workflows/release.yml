name: Release

# Tag vX.Y.Z → run tests → build the exe from that exact tag on a clean
# GitHub-hosted runner → attach exe + SHA256SUMS to a GitHub Release.
# Binaries are never committed to the repository; this workflow is the only
# distribution path, so every published exe is reproducible from public source.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need the full tag history for the changelog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet pyinstaller pystray Pillow pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests (release gate)
        run: python -m pytest tests/ -v

      - name: Generate icons
        run: python make_icon.py

      - name: Build single-file exe
        run: pyinstaller ClaudeCodexUsage.spec --noconfirm --clean

      # A one-file build unpacks itself at startup, which antivirus heuristics
      # routinely flag. The folder build has nothing to unpack, so it is shipped
      # as an alternative for anyone whose scanner blocks the single file.
      - name: Build folder version
        run: pyinstaller ClaudeCodexUsage-dir.spec --noconfirm

      - name: Zip the folder version
        run: Compress-Archive -Path dist/ClaudeCodexUsage -DestinationPath dist/ClaudeCodexUsage-folder.zip

      - name: Compute checksums
        run: |
          $lines = @()
          foreach ($f in 'ClaudeCodexUsage.exe', 'ClaudeCodexUsage-folder.zip') {
            $hash = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $f"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Direct pushes to main produce no PRs, so GitHub's generated notes are
      # only a compare link. List the commits since the previous tag instead.
      # Every line is echoed (not a heredoc) so the whole script stays indented
      # inside this YAML block scalar.
      - name: Build release notes
        shell: bash
        run: |
          prev=$(git tag --sort=-creatordate | grep -vFx "$GITHUB_REF_NAME" | head -1)
          {
            echo '## 変更点'
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo '---'
            echo
            echo '単一ファイルの Windows 用 exe です。Python のインストールは不要です。'
            echo
            echo '**「Windows によって PC が保護されました」と出る場合**: コード署名をしていないため、初回起動時に SmartScreen の警告が出ます。異常ではありません。「詳細情報」（左上の小さいリンク）→「実行」で起動できます。次回からは出ません。'
            echo
            echo '**検証**: ダウンロード後、PowerShell で `Get-FileHash ClaudeCodexUsage.exe -Algorithm SHA256` を実行し、`SHA256SUMS.txt` の値と一致することを確認してください。exe は GitHub Actions が公開ソースから自動ビルドしたものです。'
            echo
            echo '**ウイルス対策ソフトに止められる場合**: 署名のない PyInstaller 製の exe は誤検知されることがあります。その場合は `ClaudeCodexUsage-folder.zip` をお使いください。展開して中の `ClaudeCodexUsage.exe` を実行します（起動時の自己展開がないため誤検知されにくい形式です）。'
          } > CHANGES.md
          cat CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeCodexUsage.exe
            dist/ClaudeCodexUsage-folder.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body_path: CHANGES.md
          append_body: true
